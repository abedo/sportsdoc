security:
    # Użytkownicy żyją w bazie; logowanie wyłącznie przez Google lub Facebooka (bez haseł).
    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: id

    # ROLE_ORGANIZER: może zakładać miejsca (w swoich miejscach zarządza jako organizator miejsca).
    # ROLE_ADMIN: administrator serwisu, może wszystko. Uprawnienia per miejsce sprawdza PlaceVoter.
    role_hierarchy:
        ROLE_ORGANIZER: ROLE_USER
        ROLE_ADMIN: [ROLE_ORGANIZER, ROLE_USER]

    firewalls:
        dev:
            pattern: ^/(_profiler(/|$)|(_wdt|assets|build|css|js)/)
            security: false
        main:
            lazy: true
            provider: app_user_provider
            custom_authenticators:
                - App\Security\SocialAuthenticator
            logout:
                path: app_logout
                target: security_login

    # Bez logowania dostępne jest tylko logowanie. Uprawnienia do miejsc, gier i wpłat sprawdza PlaceVoter na kontrolerach.
    access_control:
        - { path: ^/(login|connect|logout), roles: PUBLIC_ACCESS }
        - { path: ^/dev/login, roles: PUBLIC_ACCESS }
        - { path: '^/user(/|$)', roles: ROLE_ADMIN }
        - { path: '^/place/new$', roles: ROLE_ORGANIZER }
        - { path: ^/, roles: ROLE_USER }
