security:
    # Użytkownicy żyją w bazie; logowanie jest wyłącznie przez Google (bez haseł).
    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    # Organizator (ROLE_ADMIN) może wszystko, co zwykła osoba (ROLE_USER).
    role_hierarchy:
        ROLE_ADMIN: ROLE_USER

    firewalls:
        dev:
            pattern: ^/(_profiler(/|$)|(_wdt|assets|build|css|js)/)
            security: false
        main:
            lazy: true
            provider: app_user_provider
            custom_authenticators:
                - App\Security\GoogleAuthenticator
            logout:
                path: app_logout
                target: security_login

    # Bez logowania dostępne jest tylko logowanie. Uprawnienia admina są też na kontrolerach (#[IsGranted]).
    access_control:
        - { path: ^/(login|connect|logout), roles: PUBLIC_ACCESS }
        - { path: ^/dev/login, roles: PUBLIC_ACCESS }
        # Adresy tylko dla organizatora blokujemy tu, zanim kontroler wczyta encję (403 zamiast 404 dla zwykłej osoby).
        - { path: '^/(user|payment)(/|$)', roles: ROLE_ADMIN }
        - { path: '^/place/(new|\d+/edit)$', roles: ROLE_ADMIN }
        - { path: '^/game/(new|\d+/(edit|attendance))$', roles: ROLE_ADMIN }
        - { path: '^/(place|game)/\d+$', methods: [DELETE], roles: ROLE_ADMIN }
        - { path: ^/, roles: ROLE_USER }
